# UCM2 profile for Xiaomi Mi 4 (cancro) internal speaker.
#
# Card: Mi4Taiko (snd_soc_lumia1520_q6 machine driver, WCD9320/Taiko codec)
# Path: MultiMedia1 -> ADM -> AFE SLIMBUS_0_RX -> RX1 -> RX7 -> speaker PA
#
# The two EnableSequence controls are the ALSA routes that the manual test
# script used to set with amixer:
#   'SLIMBUS_0_RX Audio Mixer MultiMedia1' 1  (backend routing)
#   'Mi4 Speaker Gate Switch' 1               (DAPM virtual gate -> PA)
# They are toggled in the same order the test script used.
#
# The codec is mono 48 kHz only; PipeWire is expected to do the mixing and
# downmixing. Keep a single PCM open at a time.

SectionVerb {
	EnableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 1"
		cset "name='Mi4 Speaker Gate Switch' 1"
	]

	DisableSequence [
		cset "name='Mi4 Speaker Gate Switch' 0"
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal speaker"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 1
	}
}
