[Unit]
Description=OBD Gauge direct startup without boot movie
# No audio/user-session requirements for the dashboard's first frame.
Wants=
Wants=bluetooth.target obd-boot-curtain.service

[Service]
ExecStart=
ExecStart=/usr/bin/python3 /usr/local/lib/obd-gauge/launch_gauge_direct.py --ble
ExecStopPost=
ExecStopPost=/usr/bin/python3 /usr/local/lib/obd-gauge/launch_gauge_direct.py --restore-backlight
